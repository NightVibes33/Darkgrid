name: Transfer Tesseract Launch Reference

on:
  push:
    branches:
      - mabu-assets-transfer-20260922

jobs:
  fetch-launch:
    runs-on: ubuntu-latest
    steps:
      - name: Download launch reference
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JA62RTSWrerhK4O20lVs9K7hJj/7156aa84-04c0-4b48-9963-ac73c77ec920.mp4' -o tesseract-launch.mp4
          test "$(stat -c%s tesseract-launch.mp4)" -gt 1000000
          ffprobe -v error -show_entries format=duration -show_entries stream=width,height,r_frame_rate -of compact tesseract-launch.mp4
      - name: Upload launch reference
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-launch-reference
          path: tesseract-launch.mp4
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
