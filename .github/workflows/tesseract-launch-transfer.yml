name: Transfer Tesseract Launch Reference

on:
  push:
    branches:
      - mabu-assets-transfer-20260922

jobs:
  fetch-launch:
    runs-on: ubuntu-latest
    steps:
      - name: Download launch reference from X
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q yt-dlp
          yt-dlp --no-playlist -f 'bv*+ba/b' --merge-output-format mp4 -o tesseract-launch.mp4 'https://x.com/trymirage/status/2102429594804429138'
          test "$(stat -c%s tesseract-launch.mp4)" -gt 1000000
          ffprobe -v error -show_entries format=duration -show_entries stream=width,height,r_frame_rate -of compact tesseract-launch.mp4
      - name: Upload launch reference
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-launch-reference
          path: tesseract-launch.mp4
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
