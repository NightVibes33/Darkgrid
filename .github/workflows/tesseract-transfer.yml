name: Mesa Vulkan transfer

on:
  push:
    branches:
      - tesseract-transfer-20260922

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download Debian 13 Mesa Vulkan driver
        shell: bash
        run: |
          set -euo pipefail
          url="https://ftp.debian.org/debian/pool/main/m/mesa/mesa-vulkan-drivers_25.0.7-2%2Bdeb13u1_amd64.deb"
          curl -fL "$url" -o mesa-vulkan-drivers_25.0.7-2+deb13u1_amd64.deb
          echo "caf2f7d296b7522efe74e40a74bce762a3ce84c33b53b5e54e1248ac2e0a13a5  mesa-vulkan-drivers_25.0.7-2+deb13u1_amd64.deb" | sha256sum -c -
      - name: Upload verified Debian package
        uses: actions/upload-artifact@v4
        with:
          name: mesa-vulkan-driver
          path: mesa-vulkan-drivers_25.0.7-2+deb13u1_amd64.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
