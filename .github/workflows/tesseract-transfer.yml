name: Tesseract transfer

on:
  push:
    branches:
      - tesseract-transfer-20260922

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download official Mirage Tesseract Linux preview
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/mirage-hq/Tesseract/releases/download/v0.2.0-preview.1/tesseract-0.2.0-preview.1-linux-x86_64.zip"
          curl -fL "$url" -o tesseract-0.2.0-preview.1-linux-x86_64.zip
          echo "c81a89d180dfa08d55fa4b12ecbbfe2eac51c330956998e14eb4873bc00e1ee1  tesseract-0.2.0-preview.1-linux-x86_64.zip" | sha256sum -c -
      - name: Upload verified bundle
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-linux-preview
          path: tesseract-0.2.0-preview.1-linux-x86_64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
