name: Darkgrid
options:
  bundleIdPrefix: com.nightvibes33
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 63
    MARKETING_VERSION: 1.2.0

targets:
  Darkgrid:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: App
        excludes: [Info.plist]
    dependencies:
      - target: DarkgridExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightvibes33.Darkgrid
        PRODUCT_NAME: Darkgrid
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DarkgridExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: SafariExtension
        excludes: [Info.plist, Resources]
      - path: SafariExtension/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightvibes33.Darkgrid.Extension
        PRODUCT_NAME: DarkgridExtension
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SafariExtension/Info.plist
schemes:
  Darkgrid:
    build:
      targets: {Darkgrid: all, DarkgridExtension: all}
    run: {config: Debug}
    test: {config: Debug}
    profile: {config: Release}
    analyze: {config: Debug}
    archive: {config: Release}
