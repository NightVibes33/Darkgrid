name: Darkgrid
options:
  bundleIdPrefix: com.nightvibes33
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 63
    MARKETING_VERSION: 1.2.0

targets:
  Darkgrid:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: App
        excludes: [Info.plist, NeonGrid.entitlements]
    dependencies:
      - target: DarkgridExtension
        embed: true
    preBuildScripts:
      - name: Generate NeonGrid app icon
        script: |
          cat "$SRCROOT"/Scripts/NeonGridIconSource.*.b64 | /usr/bin/base64 -D > /tmp/neongrid-icon-source.jpg
          /usr/bin/sips -s format png -z 1024 1024 /tmp/neongrid-icon-source.jpg --out "$SRCROOT/App/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png" >/dev/null
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightvibes33.Darkgrid
        PRODUCT_NAME: Darkgrid
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/NeonGrid.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  DarkgridExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: SafariExtension
        excludes: [Info.plist, Resources, NeonGridExtension.entitlements]
      - path: SafariExtension/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightvibes33.Darkgrid.Extension
        PRODUCT_NAME: DarkgridExtension
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SafariExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: SafariExtension/NeonGridExtension.entitlements
schemes:
  Darkgrid:
    build:
      targets: {Darkgrid: all, DarkgridExtension: all}
    run: {config: Debug}
    test: {config: Debug}
    profile: {config: Release}
    analyze: {config: Debug}
    archive: {config: Release}
